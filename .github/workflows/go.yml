# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write  # needed to create releases and upload assets

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true

    - name: Test
      run: go test -v ./...

    - name: Build cross-platform binaries (dist/)
      shell: bash
      run: |
        set -euo pipefail

        VERSION="$(grep 'const Version' internal/version/version.go | sed 's/.*"\(.*\)"/\1/')"
        echo "Building ctdbtools v${VERSION}"

        DIST_DIR="dist"
        rm -rf "${DIST_DIR}"
        mkdir -p "${DIST_DIR}"

        TARGETS=(
          "darwin/amd64"
          "darwin/arm64"
          "linux/amd64"
          "linux/arm64"
          "windows/amd64"
        )

        for target in "${TARGETS[@]}"; do
          GOOS="${target%/*}"
          GOARCH="${target#*/}"

          OUTPUT_NAME="ctdbtools-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          echo "Building ${OUTPUT_NAME}..."
          GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build -ldflags="-s -w" -o "${DIST_DIR}/${OUTPUT_NAME}" ./cmd/ctdbtools
        done

        echo ""
        echo "Build complete! Binaries in dist/:"
        ls -lh "${DIST_DIR}"

    - name: Upload dist artifacts (CI)
      uses: actions/upload-artifact@v4
      with:
        name: ctdbtools-dist
        path: dist/

    # Only runs on tag pushes like refs/tags/v1.2.3
    - name: Create GitHub Release and upload binaries
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
